name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: jace_test
          POSTGRES_USER: jace_test
          POSTGRES_PASSWORD: jace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jace_test -d jace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JACE_TEST_DATABASE_URL: postgresql://jace_test:jace_test@localhost:5432/jace_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.4"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: Run tests
        run: python -m pytest

      - name: Check frontend
        run: |
          node --check jace/static/app.js
          node --test tests/test_portfolio_frontend.cjs
