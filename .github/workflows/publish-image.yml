name: Publish Docker image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v"
        required: true
        default: "1.0.0"
      push_latest:
        description: "Also publish the latest tag"
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  packages: write

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: jace_test
          POSTGRES_USER: jace_test
          POSTGRES_PASSWORD: jace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jace_test -d jace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JACE_TEST_DATABASE_URL: postgresql://jace_test:jace_test@localhost:5432/jace_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.4"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: Run tests
        run: python -m pytest

      - name: Check frontend
        run: |
          node --check jace/static/app.js
          node --test tests/test_portfolio_frontend.cjs

  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jace"
          version="${{ steps.release.outputs.version }}"

          tags=(
            --tag "$image:$version"
            --tag "$image:v$version"
          )

          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs.push_latest }}" == "true" ]]; then
            tags+=(--tag "$image:latest")
          fi

          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=$version" \
            "${tags[@]}" \
            .
          docker push --all-tags "$image"
